<main class="min-h-dvh bg-surface-page text-text-primary">
  <div class="mx-auto flex max-w-3xl flex-col gap-10 p-8">
    <header class="flex items-center justify-between gap-4">
      <div class="flex flex-col gap-1">
        <h1 class="text-title">Design system — Alerte</h1>
        <p class="text-body text-text-secondary">Button · Badge · Avatar</p>
      </div>
      <button appButton variant="secondary" (click)="toggleTheme()">
        {{ dark() ? 'Thème clair' : 'Thème sombre' }}
      </button>
    </header>

    <section class="flex flex-col gap-3">
      <h2 class="text-heading">Button</h2>
      <div class="flex flex-wrap items-center gap-3">
        <button appButton variant="primary">Se connecter</button>
        <button appButton variant="secondary">Annuler</button>
        <button appButton variant="ghost">Ignorer</button>
        <button appButton variant="danger">Anonymiser</button>
        <button appButton variant="primary" disabled>Désactivé</button>
      </div>
    </section>

    <section class="flex flex-col gap-3">
      <h2 class="text-heading">Badge</h2>
      <div class="flex flex-wrap items-center gap-2">
        <app-badge tone="neutral" variant="outline">Membre</app-badge>
        <app-badge tone="accent">Admin</app-badge>
        <app-badge tone="success">Actif</app-badge>
        <app-badge tone="warning">En attente</app-badge>
        <app-badge tone="danger">Suspendu</app-badge>
        <app-badge tone="neutral">Anonymisé</app-badge>
      </div>
    </section>

    <section class="flex flex-col gap-3">
      <h2 class="text-heading">Avatar</h2>
      <div class="flex items-center gap-4">
        <app-avatar initials="JM" size="sm" presence="online" ariaLabel="Julien Meyer" />
        <app-avatar initials="SN" size="md" presence="offline" ariaLabel="Sofia Nkolo" />
        <app-avatar initials="YR" size="lg" ariaLabel="Yannick Remy" />
      </div>
    </section>
  </div>
</main>
