# ===========================================================================
# Serveur frontal — TLS, fichiers statiques, relais vers l'API
# ===========================================================================

# --- Port 80 : défi Let's Encrypt et redirection ---
server {
    listen 80;
    listen [::]:80;
    server_name alerte.yannickremy.fr;

    # Le renouvellement du certificat dépose un fichier ici ; il doit rester joignable
    # en clair, sans redirection, sinon la validation échoue.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443 : l'application ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alerte.yannickremy.fr;

    ssl_certificate     /etc/letsencrypt/live/alerte.yannickremy.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alerte.yannickremy.fr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- En-têtes de sécurité ---
    # Impose HTTPS pendant un an, y compris si l'utilisateur tape l'adresse en clair.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Interdit au navigateur de deviner un type MIME différent de celui annoncé.
    add_header X-Content-Type-Options "nosniff" always;
    # Empêche l'inclusion du site dans une iframe tierce (détournement de clic).
    add_header X-Frame-Options "DENY" always;
    # Ne divulgue pas l'URL d'origine vers un site externe.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Masque le numéro de version de Nginx dans les réponses et les pages d'erreur.
    server_tokens off;

    client_max_body_size 2m;

    # Résolveur DNS interne de Docker. Associé aux variables employées dans les `proxy_pass`
    # ci-dessous, il force Nginx à résoudre le nom `api` à chaque requête plutôt qu'une
    # seule fois au démarrage. Sans cela, le conteneur applicatif recréé à chaque
    # déploiement reçoit une nouvelle adresse, et Nginx continuerait d'interroger
    # l'ancienne — en renvoyant des 502 jusqu'à son propre redémarrage.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Compression ---
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Interface de programmation ---
    location /api/ {
        set $api_host api;
        proxy_pass http://$api_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Canal temps réel ---
    # Un WebSocket commence par une requête HTTP qui demande à changer de protocole.
    # Sans la transmission explicite de `Upgrade` et `Connection`, Nginx traite l'échange
    # comme une requête ordinaire et la négociation échoue. C'est l'oubli le plus fréquent
    # de ce type de déploiement.
    location /ws {
        set $api_host api;
        proxy_pass http://$api_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une connexion temps réel reste ouverte sans trafic pendant de longues périodes ;
        # le délai par défaut de 60 s la couperait régulièrement.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Fichiers du client ---
    root /usr/share/nginx/html;
    index index.html;

    # Les fichiers produits par la construction portent une empreinte dans leur nom :
    # un changement de contenu change le nom, ils peuvent donc être mis en cache
    # indéfiniment sans risque de servir une version périmée.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Toute autre adresse renvoie index.html : le routage est assuré côté client, et
    # /messages ou /administration/groupes ne correspondent à aucun fichier sur le disque.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
