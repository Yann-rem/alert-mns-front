name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée sur la même branche annule le run précédent, encore en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # La version vient de package.json (champ "volta", puis "engines") : une seule
      # source de vérité entre la machine de développement et le runner.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      # "ci" et non "install" : installe strictement le lockfile et échoue s'il diverge
      # de package.json. Le .npmrc du dépôt (legacy-peer-deps) est pris en compte.
      - name: Install dependencies
        run: npm ci

      # Prettier + ordre des classes Tailwind. Placé en premier car c'est le plus rapide.
      - name: Check formatting
        run: npm run format:check

      # Vitest sous jsdom : aucun navigateur à installer sur le runner.
      - name: Unit tests
        run: npx ng test --watch=false

      # Build de production : compilation AOT stricte et budgets de taille — attrape les
      # erreurs de template que les tests unitaires ne couvrent pas.
      - name: Production build
        run: npx ng build

  # Publication de l'image servant le client. Ne s'exécute qu'après la réussite des tests
  # et du build, et uniquement sur la branche principale.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GHCR n'accepte que des noms d'image en minuscules, là où le propriétaire du dépôt
      # comporte une majuscule. L'expansion ${VAR,,} de bash fait la conversion.
      - name: Résoudre le nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alert-mns-front" >> "$GITHUB_ENV"

      - name: Se connecter au registre
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      # L'image reconstruit le client depuis les sources plutôt que de récupérer le
      # `dist/` produit à l'étape précédente : elle reste ainsi reproductible hors de
      # cette chaîne, sur n'importe quelle machine disposant de Docker.
      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Mise en production. Le script appelé côté serveur récupère les images des DEUX dépôts :
  # sans ce travail, une modification du seul client serait publiée mais jamais mise en ligne.
  deploy:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Préparer la clé de déploiement
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_ed25519 <<< "${{ secrets.DEPLOY_SSH_KEY }}"
          # Empreinte fournie en variable plutôt que découverte à chaque exécution : une
          # découverte à la volée accepterait n'importe quel hôte se présentant à cette
          # adresse, ce qui viderait la vérification de son sens.
          echo "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Déployer
        run: ssh ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} deploy
